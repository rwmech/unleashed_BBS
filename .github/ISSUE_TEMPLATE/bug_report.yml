# SPDX-License-Identifier: GPL-3.0-or-later
# µnleashed BBS: the bug report form on GitHub's "New issue" page.
# Copyright 2026 - Robert Mech
# Written for callers and sysops, not developers: plain words, nothing
# required that a caller on somebody else's board cannot find out.
name: Report a bug
description: Something on a µnleashed board did not work the way it should.
title: "Bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time. You don't need to be a programmer
        to fill this in. Answer what you can, and leave a box empty if you
        don't know.

        If the board froze, dropped you or showed something odd, that
        counts. A hiccup that happened once is still worth telling us
        about.

  - type: input
    id: version
    attributes:
      label: Firmware version
      description: >-
        Type HARDWARE (or ABOUT) on the board and copy the version from the
        top line, brackets and all. The part in brackets is the board's own
        version. A sysop can also read it on the top line of SYS.
      placeholder: "1.2.1 (WS43B 1.0.1)"
    validations:
      required: true

  - type: input
    id: board
    attributes:
      label: Which board
      description: >-
        The Board line of HARDWARE shows it. If you called somebody else's
        board, give that board's name or address instead.
      placeholder: "Waveshare ESP32-S3-LCD-1.47, ESP32-WROOM-32E, AI-Thinker ESP32-CAM..."
    validations:
      required: true

  - type: dropdown
    id: connection
    attributes:
      label: How you were connected
      options:
        - Telnet
        - SSH
        - Not sure
    validations:
      required: false

  - type: input
    id: client
    attributes:
      label: What you called from
      description: >-
        The terminal program or app, and the computer or phone it ran on.
      placeholder: "SyncTERM on Windows, TERMinator on Android, PuTTY, a VT220 on a serial line, an Amiga..."
    validations:
      required: true

  - type: textarea
    id: happened
    attributes:
      label: What happened
      description: >-
        What you saw, in your own words. If there was a message on the
        screen, copy it here exactly. A photo or screenshot helps too: drag
        it into this box.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected
      description: What you thought would happen instead.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: How to make it happen again
      description: >-
        The steps, one per line, starting from connecting to the board. If
        it only happened once, say what you were doing just before.
      placeholder: |
        1. Connected over telnet and logged in
        2. Typed FILES and picked area 1
        3. Pressed D on the third file
    validations:
      required: true

  - type: textarea
    id: more
    attributes:
      label: Anything else
      description: >-
        Optional. How often it happens, what else was going on (other
        callers, a camera snapshot, a backup), or, for a sysop, any lines
        from the board's serial console. Leave out passwords and anything
        private.
    validations:
      required: false
