# SPDX-License-Identifier: GPL-3.0-or-later
# ===========================================================================
#  µnleashed BBS: release on a version tag
#
#  Push a tag v<BBS_VERSION> and this builds the release with
#  tools/release.py on a fresh checkout and publishes it as a GitHub Release.
#  The directory server's deploy/update.sh fetches the newest release from
#  there, checks it against SHA256SUMS, and the web installer offers it.
#
#  Four image sets from the one release.py run (its BUILDS table): the
#  ESP32 (WROOM-32E) under the plain asset names every release has had; the
#  ESP32-S3 (the Waveshare ESP32-S3-LCD-1.47 profile) as esp32s3-*; the
#  Freenove ESP32-WROVER CAM as esp32-fncam-* (1.1.0); and the AI-Thinker
#  ESP32-CAM as esp32-cam-* (1.1.1). PlatformIO fetches the S3's toolchain
#  and target files itself; the cache below keeps them between runs.
#
#  A fresh checkout is the point: include/secrets.h and data/system.cfg are
#  git-ignored, so they cannot exist here, and the release environment
#  ignores secrets.h anyway. release.py still searches every image for
#  anything that looks like a password before it lets the files out.
# ===========================================================================
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write            # to create the release and upload its assets

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini', 'src/idf_component.yml') }}

      - name: PlatformIO
        run: pip install platformio

      - name: Build and check the release
        run: python3 tools/release.py --tag "${GITHUB_REF_NAME}"

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        # A tag with a suffix (v1.1.0-dev.8) is a pre-release, a plain
        # vX.Y.Z a full one. The directory serves each board from the latest
        # full release that carries it, and a board no full release carries
        # yet from the newest pre-release that does, labelled preview, so a
        # new board can ship ahead of a core release.
        run: |
          ver="${GITHUB_REF_NAME#v}"
          kind=""
          case "${ver}" in *-*) kind="--prerelease" ;; esac
          gh release create "${GITHUB_REF_NAME}" release/"${ver}"/assets/* ${kind} \
            --title "µnleashed BBS ${ver}" \
            --notes "Flash it from https://unleashedbbs.com/install. The ESP32 (WROOM) images carry their plain names; the Waveshare ESP32-S3-LCD-1.47 images an esp32s3- prefix, the Freenove ESP32-WROVER CAM images esp32-fncam-, the AI-Thinker ESP32-CAM images esp32-cam- and the Makerfabs ESP32-S3 Parallel TFT 3.5-inch v1.0 images esp32s3-mf35-; a board pre-release (vX.Y.Z-<board>.N) carries that board's set only; each set's version.txt says its version. SHA256SUMS lists every file."
