# ===========================================================================
#  µnleashed BBS: plugins.lock
#
#  The plugins kept in repositories of their own, each pinned to the one
#  commit the firmware is built with (LINK.md, "Plugins in their own
#  repositories"). tools/plugins.py fetches them into ext/<name>; a
#  PlatformIO environment's custom_ext_plugins says which it builds in.
#
#  One plugin a line:  name  source  commit
#    source  a git URL, or a local path for developing one beside the core
#    commit  the full 40-character commit; "-" takes a local path's working
#            tree as it is (never in a release)
