; File:        platformio.ini
; Description: Unleashed BBS core build for the bare ESP32-WROOM-32E.
;              (Kept ASCII: the micro-sign spelling lives in src/config.h.)
;              Build:     pio run
;              Flash:     pio run -t upload
;              Screens:   pio run -t uploadfs   (erases calls.log)
;              Both:      pio run -t flashall
;              Console:   pio device monitor

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform              = espressif32@6.9.0   ; ESP-IDF 5.3.1, the verified version
board                 = esp32dev
framework             = espidf
board_upload.flash_size = 4MB
board_build.partitions  = partitions.csv
board_build.filesystem  = littlefs
upload_speed          = 921600
monitor_speed         = 115200
monitor_filters       = esp32_exception_decoder
extra_scripts         = tools/pio_flashall.py

; Bench testing only: the backup button counts as held down, so the window
; opens as soon as the sysop logs in. Never flash this to a live board.
;   pio run -e esp32dev_backuptest -t upload
[env:esp32dev_backuptest]
extends               = env:esp32dev
build_flags           = -DBBS_BACKUP_TEST_OPEN
