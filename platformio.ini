[platformio]
default_envs = esp32dev

[env:esp32dev]
platform              = espressif32@6.9.0   ; ESP-IDF 5.3.1, the verified version
board                 = esp32dev
framework             = espidf
board_upload.flash_size = 4MB
board_build.partitions  = partitions.csv
board_build.filesystem  = littlefs
upload_speed          = 921600
monitor_speed         = 115200
monitor_filters       = esp32_exception_decoder
; pio_plugins.py (1.2.0) fetches the plugins custom_ext_plugins names, at
; the commits plugins.lock pins, before the build (LINK.md, "Plugins in their
; own repositories"). None named: it does nothing.
extra_scripts         = pre:tools/pio_plugins.py
                        tools/pio_flashall.py
custom_ext_plugins    =

; Bench testing only: the backup button counts as held down, so the window
; opens as soon as the sysop logs in. Never flash this to a live board.
;   pio run -e esp32dev_backuptest -t upload
[env:esp32dev_backuptest]
extends               = env:esp32dev
build_flags           = -DBBS_BACKUP_TEST_OPEN

; Transfer diagnostics. Narrates every byte the XMODEM/YMODEM engine is fed,
; every block it accepts and every byte it sends back, to the serial console.
;
; This exists because a terminal window shows what the FAR END thinks
; happened, and twice that led to the wrong conclusion about what the board
; was doing. Flash this, run one transfer, and read the console:
;
;   pio run -e esp32dev_diag -t upload
;   pio device monitor
;
; Then flash the ordinary build again. It is noisy by design and the logging
; itself will slow a transfer down, so it is a diagnosis tool, not a setting.
[env:esp32dev_diag]
extends               = env:esp32dev
build_flags           = -DBBS_XFER_DIAG

; Bench testing only: proves the task watchdog restarts a wedged board. A
; minute after the BBS loop starts it stops, blocked, and the watchdog should
; restart the board within 30 s with "task watchdog" in reboots.log. It then
; does it again every time, so flash the ordinary build afterwards.
;   pio run -e esp32dev_wdttest -t upload
[env:esp32dev_wdttest]
extends               = env:esp32dev
build_flags           = -DBBS_WDT_TEST

; The public release, built by tools/release.py and by the GitHub Action on a
; version tag. BBS_RELEASE makes main.cpp ignore include/secrets.h even when
; the file exists, so a release built on a developer's own machine still
; carries nobody's Wi-Fi. The board gets its network from Improv instead.
;   python3 tools/release.py
[env:esp32dev_release]
extends               = env:esp32dev
build_flags           = -DBBS_RELEASE

; ---------------------------------------------------------------------------
; Waveshare ESP32-S3-LCD-1.47 (SKU 28317, the USB-A stick): ESP32-S3R8,
; 16 MB quad flash, 8 MB octal PSRAM, a TF slot, one WS2812B and a 1.47"
; ST7789 panel. A board profile, never a fork: BBS_BOARD_WS_S3LCD147 picks
; its defaults in src/board.h and compiles in what only it has (the panel
; plugin). Its sdkconfig layer is sdkconfig.defaults.esp32s3, which ESP-IDF
; reads after sdkconfig.defaults for every esp32s3 build without being told.
;
; It has no USB-serial bridge: the USB-A plug is the S3's own USB, which is
; the console, the flashing port and Improv's port all at once.
;   pio run -e ws_s3_lcd147 -t upload --upload-port COMn
;   pio run -e ws_s3_lcd147 -t uploadfs --upload-port COMn    (the screens)
;
; Its own 8 MB layout since 1.1.2 (partitions_s3.csv): 3 MB program slots,
; for SSH and what follows it, and the image header says 8 MB so the same
; build boots on an 8 MB S3 too. The first 1.1.2 install on an S3 is an
; erase (the data partitions moved). Flash mode DIO, as Waveshare's own demo
; runs it; QIO is untried on this part.
; See ESP32_BOARD_CHOICE.md and internal/board-waveshare-s3-lcd147-2026-09-24.md.
[env:ws_s3_lcd147]
platform              = espressif32@6.9.0
board                 = esp32-s3-devkitc-1
framework             = espidf
board_build.flash_mode  = dio
board_upload.flash_size = 8MB
board_build.partitions  = partitions_s3.csv
board_build.filesystem  = littlefs
upload_speed          = 921600
monitor_speed         = 115200
monitor_filters       = esp32_exception_decoder
extra_scripts         = pre:tools/pio_plugins.py
                        tools/pio_flashall.py
custom_ext_plugins    =
build_flags           = -DBBS_BOARD_WS_S3LCD147

; Its public release, as esp32dev_release is the WROOM's: secrets.h ignored.
;   python3 tools/release.py
[env:ws_s3_lcd147_release]
extends               = env:ws_s3_lcd147
build_flags           = -DBBS_BOARD_WS_S3LCD147 -DBBS_RELEASE

; ---------------------------------------------------------------------------
; Waveshare ESP32-S3-Touch-LCD-4.3B (1.1.2, WS43B): ESP32-S3-WROOM-1-N16R8,
; 16 MB flash, 8 MB octal PSRAM, native USB only, an 800 x 480 RGB panel with
; GT911 touch, a CH422G expander, a TF slot, an RTC, RS485 and CAN. A board
; profile, never a fork: BBS_BOARD_WS_S3TOUCH43B picks its defaults in
; src/board.h. Its sdkconfig layer (sdkconfig.defaults.ws43b: the program run
; from PSRAM, the RGB interrupt in IRAM) is read after the S3 layer. The S3's
; 8 MB layout (partitions_s3.csv); the rest of the 16 MB is unused.
;
; Native USB, as the Waveshare stick:
;   pio run -e ws_s3touch43b -t upload --upload-port COMn
;   pio run -e ws_s3touch43b -t uploadfs --upload-port COMn
[env:ws_s3touch43b]
extends               = env:ws_s3_lcd147
build_flags           = -DBBS_BOARD_WS_S3TOUCH43B
board_build.cmake_extra_args = -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.defaults.ws43b"

; Its public release: secrets.h ignored.
;   python3 tools/release.py --tag v1.1.2-ws43b.1
[env:ws_s3touch43b_release]
extends               = env:ws_s3touch43b
build_flags           = -DBBS_BOARD_WS_S3TOUCH43B -DBBS_RELEASE
; Makerfabs ESP32-S3 Parallel TFT with Touch 3.5" (ILI9488), hardware v1.0:
; ESP32-S3-WROOM-1-N16R2, 16 MB flash, 2 MB quad PSRAM, a CP2104 on UART0
; beside the chip's own USB, a micro SD slot and a 480 x 320 ILI9488 on a
; 16-bit parallel bus. A board profile, never a fork: BBS_BOARD_MF_S3PAR35
; picks its defaults in src/board.h. Its sdkconfig layer is
; sdkconfig.defaults.mf35, read after the S3 layer (quad PSRAM, the console on
; UART0). Not for the v2.0 board, which carries octal PSRAM.
;
; Flash and monitor through the USB-C port marked USB-TTL (auto-reset):
;   pio run -e makerfabs_s3_par35 -t upload --upload-port COMn
;   pio run -e makerfabs_s3_par35 -t uploadfs --upload-port COMn
; From 1.1.2 (MF35 1.1.0) it takes everything the Waveshare's env gives an
; S3: the 8 MB layout (partitions_s3.csv; the rest of the 16 MB is unused)
; and SSH (BBS_HAS_SSH in its block of src/board.h). The first install over
; the 1.1.1 preview is an erase, as on the Waveshare: the data partitions
; moved.
[env:makerfabs_s3_par35]
extends               = env:ws_s3_lcd147
build_flags           = -DBBS_BOARD_MF_S3PAR35
board_build.cmake_extra_args = -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.defaults.mf35"

; Its public release: secrets.h ignored.
;   python3 tools/release.py
[env:makerfabs_s3_par35_release]
extends               = env:makerfabs_s3_par35
build_flags           = -DBBS_BOARD_MF_S3PAR35 -DBBS_RELEASE

; Makerfabs ESP32-S3 Parallel TFT with Touch 3.5" (ILI9488), hardware v2.0
; (MF35V2 1.0.0, on 1.2.0): ESP32-S3-WROOM-1-N16R8, 16 MB flash, 8 MB octal
; PSRAM, the panel's WR, D/C and CS moved to 18, 17 and 46, FT6236 touch.
; A board profile, never a fork: BBS_BOARD_MF_S3PAR35V2 picks its defaults
; in src/board.h. The S3 layer as it stands (octal PSRAM, the console on the
; chip's own USB, the VFS table at 12), then sdkconfig.defaults.mf35v2,
; which sets nothing since 1.2.1 and holds the board's notes. The S3's
; 8 MB layout (partitions_s3.csv); the rest of the 16 MB is unused. SSH on.
;
; Flash and monitor through the USB-C port marked USB-NATIVE (the console
; and Improv's port); USB-TTL flashes too but carries no console:
;   pio run -e makerfabs_s3_par35v2 -t upload --upload-port COMn
;   pio run -e makerfabs_s3_par35v2 -t uploadfs --upload-port COMn
; See release-prep/mf35v2/pins.md.
[env:makerfabs_s3_par35v2]
extends               = env:ws_s3_lcd147
build_flags           = -DBBS_BOARD_MF_S3PAR35V2
board_build.cmake_extra_args = -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.defaults.mf35v2"

; Its public release: secrets.h ignored.
[env:makerfabs_s3_par35v2_release]
extends               = env:makerfabs_s3_par35v2
build_flags           = -DBBS_BOARD_MF_S3PAR35V2 -DBBS_RELEASE

; Guition ESP32-4848S040 (G4848 1.0.0, on 1.2.0), sold as the AITRIP 4.0":
; ESP32-S3-WROOM-1-N16R8, 16 MB flash, 8 MB octal PSRAM, a 4" 480 x 480
; ST7701S on the RGB bus with GT911 touch, a TF slot, a CH340 on UART0. A
; board profile, never a fork: BBS_BOARD_GT_4848S040 picks its defaults in
; src/board.h. The S3 layer, then sdkconfig.defaults.g4848 (the console on
; UART0, XIP from PSRAM, the RGB panel's settings, the VFS table). The S3's
; 8 MB layout (partitions_s3.csv); the rest of the 16 MB is unused. SSH on.
;
; One USB-C, through the CH340 with auto-reset:
;   pio run -e guition_4848s040 -t upload --upload-port COMn
;   pio run -e guition_4848s040 -t uploadfs --upload-port COMn
; See release-prep/g4848/pins.md.
[env:guition_4848s040]
extends               = env:ws_s3_lcd147
build_flags           = -DBBS_BOARD_GT_4848S040
board_build.cmake_extra_args = -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.defaults.g4848"

; Its public release: secrets.h ignored.
[env:guition_4848s040_release]
extends               = env:guition_4848s040
build_flags           = -DBBS_BOARD_GT_4848S040 -DBBS_RELEASE

; ---------------------------------------------------------------------------
; Freenove ESP32-WROVER CAM (FNK0060 kit, pinout 3.0): ESP32-WROVER-E, 4 MB
; flash, 8 MB PSRAM, an OV2640 and a micro SD slot wired SDMMC 1-bit. A
; board profile, never a fork: BBS_BOARD_FN_WROVER_CAM picks its defaults in
; src/board.h. There is no Freenove board definition in espressif32 6.9.0,
; so it is an esp32dev with the board's own sdkconfig layer on top
; (sdkconfig.defaults.fncam: PSRAM, revision 3 minimum), named here because
; an sdkconfig.defaults.esp32 would reach the WROOM's build too.
;
; USB-C through a CH340, auto-reset works:
;   pio run -e freenove_wrover_cam -t flashall --upload-port COMn
; See internal/PLAN-freenove-cam.md.
[env:freenove_wrover_cam]
extends               = env:esp32dev
build_flags           = -DBBS_BOARD_FN_WROVER_CAM
board_build.cmake_extra_args = -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.defaults.fncam"

; Its public release: secrets.h ignored.
;   python3 tools/release.py
[env:freenove_wrover_cam_release]
extends               = env:freenove_wrover_cam
build_flags           = -DBBS_BOARD_FN_WROVER_CAM -DBBS_RELEASE

; ---------------------------------------------------------------------------
; AI-Thinker ESP32-CAM (1.1.1): ESP32-D0WDQ6, 4 MB flash, PSRAM (an 8 MB
; chip, 4 MB of it mapped), an
; OV2640, a micro SD slot run over SPI, a flash LED on GPIO 4. A board
; profile, never a fork: BBS_BOARD_AI_ESP32CAM picks its defaults in
; src/board.h, and its sdkconfig layer (sdkconfig.defaults.espcam: PSRAM,
; no revision minimum, since these boards still carry revision 1 chips) is
; named here for the same reason as the Freenove's.
;
; On an ESP32-CAM-MB programmer (CH340G, auto-reset works):
;   pio run -e esp32cam_aithinker -t flashall --upload-port COMn
; A bare board needs a USB-serial adapter and IO0 to GND at reset instead.
[env:esp32cam_aithinker]
extends               = env:esp32dev
build_flags           = -DBBS_BOARD_AI_ESP32CAM
board_build.cmake_extra_args = -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.defaults.espcam"

; Its public release: secrets.h ignored.
[env:esp32cam_aithinker_release]
extends               = env:esp32cam_aithinker
build_flags           = -DBBS_BOARD_AI_ESP32CAM -DBBS_RELEASE

; ---------------------------------------------------------------------------
; Waveshare ESP32-S3-Touch-LCD-2 (WS2 1.0.0): ESP32-S3R8, 16 MB flash, 8 MB
; octal PSRAM, native USB-C only, a 2" 240 x 320 ST7789T3 with CST816D touch,
; a camera connector (an OV5640 as sold), a TF slot on the panel's SPI bus,
; a QMI8658 IMU and a Li-ion charger. A board profile, never a fork:
; BBS_BOARD_WS_S3TOUCH2 picks its defaults in src/board.h. Its sdkconfig
; layer is sdkconfig.defaults.ws2 (the camera's sensors), read after the S3
; layer. The LCD-1.47's 8 MB layout (partitions_s3.csv); the rest of the
; 16 MB is unused.
;
; Its USB-C is the S3's own USB (console, flashing and Improv):
;   pio run -e ws_s3touch2 -t upload --upload-port COMn
;   pio run -e ws_s3touch2 -t uploadfs --upload-port COMn
[env:ws_s3touch2]
extends               = env:ws_s3_lcd147
build_flags           = -DBBS_BOARD_WS_S3TOUCH2
board_build.cmake_extra_args = -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.defaults.ws2"

; Its public release: secrets.h ignored.
[env:ws_s3touch2_release]
extends               = env:ws_s3touch2
build_flags           = -DBBS_BOARD_WS_S3TOUCH2 -DBBS_RELEASE
; Waveshare ESP32-S3-ETH (ETH 1.0.0, 1.1.2): ESP32-S3R8, 16 MB flash, 8 MB
; octal PSRAM, a W5500 10/100 Ethernet controller with an RJ45, an OV2640 on
; a DVP connector, a TF slot over SPI, one WS2812B, USB-C to the chip's own
; USB. A board profile, never a fork: BBS_BOARD_WS_S3ETH picks its defaults
; in src/board.h. The S3's 8 MB layout (partitions_s3.csv) and the S3 layer
; (sdkconfig.defaults.esp32s3, read after each listed file for this target),
; then its own layer, sdkconfig.defaults.wseth: the W5500 driver and the
; camera's sensors.
;
; No USB-serial bridge; flash through the chip's own USB:
;   pio run -e ws_s3eth -t flashall --upload-port COMn
; The first install is an erase, as on every S3 since 1.1.2.
; See release-prep/wseth/pins.md.
[env:ws_s3eth]
platform              = espressif32@6.9.0
board                 = esp32-s3-devkitc-1
framework             = espidf
board_build.flash_mode  = dio
board_upload.flash_size = 8MB
board_build.partitions  = partitions_s3.csv
board_build.filesystem  = littlefs
upload_speed          = 921600
monitor_speed         = 115200
monitor_filters       = esp32_exception_decoder
extra_scripts         = pre:tools/pio_plugins.py
                        tools/pio_flashall.py
custom_ext_plugins    =
build_flags           = -DBBS_BOARD_WS_S3ETH
board_build.cmake_extra_args = -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.defaults.wseth"

; Its public release: secrets.h ignored.
[env:ws_s3eth_release]
extends               = env:ws_s3eth
build_flags           = -DBBS_BOARD_WS_S3ETH -DBBS_RELEASE
