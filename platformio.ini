[platformio]
default_envs = esp32dev

[env:esp32dev]
platform              = espressif32@6.9.0   ; ESP-IDF 5.3.1, the verified version
board                 = esp32dev
framework             = espidf
board_upload.flash_size = 4MB
board_build.partitions  = partitions.csv
board_build.filesystem  = littlefs
upload_speed          = 921600
monitor_speed         = 115200
monitor_filters       = esp32_exception_decoder
extra_scripts         = tools/pio_flashall.py

; Bench testing only: the backup button counts as held down, so the window
; opens as soon as the sysop logs in. Never flash this to a live board.
;   pio run -e esp32dev_backuptest -t upload
[env:esp32dev_backuptest]
extends               = env:esp32dev
build_flags           = -DBBS_BACKUP_TEST_OPEN

; Transfer diagnostics. Narrates every byte the XMODEM/YMODEM engine is fed,
; every block it accepts and every byte it sends back, to the serial console.
;
; This exists because a terminal window shows what the FAR END thinks
; happened, and twice that led to the wrong conclusion about what the board
; was doing. Flash this, run one transfer, and read the console:
;
;   pio run -e esp32dev_diag -t upload
;   pio device monitor
;
; Then flash the ordinary build again. It is noisy by design and the logging
; itself will slow a transfer down, so it is a diagnosis tool, not a setting.
[env:esp32dev_diag]
extends               = env:esp32dev
build_flags           = -DBBS_XFER_DIAG

; Bench testing only: proves the task watchdog restarts a wedged board. A
; minute after the BBS loop starts it stops, blocked, and the watchdog should
; restart the board within 30 s with "task watchdog" in reboots.log. It then
; does it again every time, so flash the ordinary build afterwards.
;   pio run -e esp32dev_wdttest -t upload
[env:esp32dev_wdttest]
extends               = env:esp32dev
build_flags           = -DBBS_WDT_TEST

; The public release, built by tools/release.py and by the GitHub Action on a
; version tag. BBS_RELEASE makes main.cpp ignore include/secrets.h even when
; the file exists, so a release built on a developer's own machine still
; carries nobody's Wi-Fi. The board gets its network from Improv instead.
;   python3 tools/release.py
[env:esp32dev_release]
extends               = env:esp32dev
build_flags           = -DBBS_RELEASE

; ---------------------------------------------------------------------------
; Waveshare ESP32-S3-LCD-1.47 (SKU 28317, the USB-A stick): ESP32-S3R8,
; 16 MB quad flash, 8 MB octal PSRAM, a TF slot, one WS2812B and a 1.47"
; ST7789 panel. A board profile, never a fork: BBS_BOARD_WS_S3LCD147 picks
; its defaults in src/board.h and compiles in what only it has (the panel
; plugin). Its sdkconfig layer is sdkconfig.defaults.esp32s3, which ESP-IDF
; reads after sdkconfig.defaults for every esp32s3 build without being told.
;
; It has no USB-serial bridge: the USB-A plug is the S3's own USB, which is
; the console, the flashing port and Improv's port all at once.
;   pio run -e ws_s3_lcd147 -t upload --upload-port COMn
;   pio run -e ws_s3_lcd147 -t uploadfs --upload-port COMn    (the screens)
;
; The 4 MB partition layout for now, so nothing else moves: the other 12 MB
; is unused until a measured step says what it is for. Flash mode DIO, as
; Waveshare's own demo runs it; QIO is untried on this part.
; See ESP32_BOARD_CHOICE.md and internal/board-waveshare-s3-lcd147-2026-09-24.md.
[env:ws_s3_lcd147]
platform              = espressif32@6.9.0
board                 = esp32-s3-devkitc-1
framework             = espidf
board_build.flash_mode  = dio
board_upload.flash_size = 16MB
board_build.partitions  = partitions.csv
board_build.filesystem  = littlefs
upload_speed          = 921600
monitor_speed         = 115200
monitor_filters       = esp32_exception_decoder
extra_scripts         = tools/pio_flashall.py
build_flags           = -DBBS_BOARD_WS_S3LCD147

; Its public release, as esp32dev_release is the WROOM's: secrets.h ignored.
;   python3 tools/release.py
[env:ws_s3_lcd147_release]
extends               = env:ws_s3_lcd147
build_flags           = -DBBS_BOARD_WS_S3LCD147 -DBBS_RELEASE

; ---------------------------------------------------------------------------
; Makerfabs ESP32-S3 Parallel TFT with Touch 3.5" (ILI9488), hardware v1.0:
; ESP32-S3-WROOM-1-N16R2, 16 MB flash, 2 MB quad PSRAM, a CP2104 on UART0
; beside the chip's own USB, a micro SD slot and a 480 x 320 ILI9488 on a
; 16-bit parallel bus. A board profile, never a fork: BBS_BOARD_MF_S3PAR35
; picks its defaults in src/board.h. Its sdkconfig layer is
; sdkconfig.defaults.mf35, read after the S3 layer (quad PSRAM, the console on
; UART0). Not for the v2.0 board, which carries octal PSRAM.
;
; Flash and monitor through the USB-C port marked USB-TTL (auto-reset):
;   pio run -e makerfabs_s3_par35 -t upload --upload-port COMn
;   pio run -e makerfabs_s3_par35 -t uploadfs --upload-port COMn
; The same 4 MB partition layout as every board for now; the rest of the
; 16 MB is unused.
[env:makerfabs_s3_par35]
extends               = env:ws_s3_lcd147
build_flags           = -DBBS_BOARD_MF_S3PAR35
board_build.cmake_extra_args = -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.defaults.mf35"

; Its public release: secrets.h ignored.
;   python3 tools/release.py
[env:makerfabs_s3_par35_release]
extends               = env:makerfabs_s3_par35
build_flags           = -DBBS_BOARD_MF_S3PAR35 -DBBS_RELEASE

; The same board, hardware v2.0, what Makerfabs sell now: an N16R8 (8 MB
; octal PSRAM, the S3 layer's own) with the panel's WR, D/C and CS moved to
; 18, 17 and 46. sdkconfig.defaults.mf35v2 changes only the console. Not yet
; on the bench: built and host-tested only.
;   pio run -e makerfabs_s3_par35v2 -t upload --upload-port COMn
[env:makerfabs_s3_par35v2]
extends               = env:ws_s3_lcd147
build_flags           = -DBBS_BOARD_MF_S3PAR35V2
board_build.cmake_extra_args = -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.defaults.mf35v2"

[env:makerfabs_s3_par35v2_release]
extends               = env:makerfabs_s3_par35v2
build_flags           = -DBBS_BOARD_MF_S3PAR35V2 -DBBS_RELEASE

; ---------------------------------------------------------------------------
; Freenove ESP32-WROVER CAM (FNK0060 kit, pinout 3.0): ESP32-WROVER-E, 4 MB
; flash, 8 MB PSRAM, an OV2640 and a micro SD slot wired SDMMC 1-bit. A
; board profile, never a fork: BBS_BOARD_FN_WROVER_CAM picks its defaults in
; src/board.h. There is no Freenove board definition in espressif32 6.9.0,
; so it is an esp32dev with the board's own sdkconfig layer on top
; (sdkconfig.defaults.fncam: PSRAM, revision 3 minimum), named here because
; an sdkconfig.defaults.esp32 would reach the WROOM's build too.
;
; USB-C through a CH340, auto-reset works:
;   pio run -e freenove_wrover_cam -t flashall --upload-port COMn
; See internal/PLAN-freenove-cam.md.
[env:freenove_wrover_cam]
extends               = env:esp32dev
build_flags           = -DBBS_BOARD_FN_WROVER_CAM
board_build.cmake_extra_args = -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.defaults.fncam"

; Its public release: secrets.h ignored.
;   python3 tools/release.py
[env:freenove_wrover_cam_release]
extends               = env:freenove_wrover_cam
build_flags           = -DBBS_BOARD_FN_WROVER_CAM -DBBS_RELEASE

; ---------------------------------------------------------------------------
; AI-Thinker ESP32-CAM (1.1.1): ESP32-D0WDQ6, 4 MB flash, PSRAM (an 8 MB
; chip, 4 MB of it mapped), an
; OV2640, a micro SD slot run over SPI, a flash LED on GPIO 4. A board
; profile, never a fork: BBS_BOARD_AI_ESP32CAM picks its defaults in
; src/board.h, and its sdkconfig layer (sdkconfig.defaults.espcam: PSRAM,
; no revision minimum, since these boards still carry revision 1 chips) is
; named here for the same reason as the Freenove's.
;
; On an ESP32-CAM-MB programmer (CH340G, auto-reset works):
;   pio run -e esp32cam_aithinker -t flashall --upload-port COMn
; A bare board needs a USB-serial adapter and IO0 to GND at reset instead.
[env:esp32cam_aithinker]
extends               = env:esp32dev
build_flags           = -DBBS_BOARD_AI_ESP32CAM
board_build.cmake_extra_args = -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.defaults.espcam"

; Its public release: secrets.h ignored.
[env:esp32cam_aithinker_release]
extends               = env:esp32cam_aithinker
build_flags           = -DBBS_BOARD_AI_ESP32CAM -DBBS_RELEASE
