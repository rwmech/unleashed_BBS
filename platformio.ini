[platformio]
default_envs = esp32dev

[env:esp32dev]
platform              = espressif32@6.9.0   ; ESP-IDF 5.3.1, the verified version
board                 = esp32dev
framework             = espidf
board_upload.flash_size = 4MB
board_build.partitions  = partitions.csv
board_build.filesystem  = littlefs
upload_speed          = 921600
monitor_speed         = 115200
monitor_filters       = esp32_exception_decoder
extra_scripts         = tools/pio_flashall.py

; Bench testing only: the backup button counts as held down, so the window
; opens as soon as the sysop logs in. Never flash this to a live board.
;   pio run -e esp32dev_backuptest -t upload
[env:esp32dev_backuptest]
extends               = env:esp32dev
build_flags           = -DBBS_BACKUP_TEST_OPEN

; Transfer diagnostics. Narrates every byte the XMODEM/YMODEM engine is fed,
; every block it accepts and every byte it sends back, to the serial console.
;
; This exists because a terminal window shows what the FAR END thinks
; happened, and twice that led to the wrong conclusion about what the board
; was doing. Flash this, run one transfer, and read the console:
;
;   pio run -e esp32dev_diag -t upload
;   pio device monitor
;
; Then flash the ordinary build again. It is noisy by design and the logging
; itself will slow a transfer down, so it is a diagnosis tool, not a setting.
[env:esp32dev_diag]
extends               = env:esp32dev
build_flags           = -DBBS_XFER_DIAG

; Bench testing only: proves the task watchdog restarts a wedged board. A
; minute after the BBS loop starts it stops, blocked, and the watchdog should
; restart the board within 30 s with "task watchdog" in reboots.log. It then
; does it again every time, so flash the ordinary build afterwards.
;   pio run -e esp32dev_wdttest -t upload
[env:esp32dev_wdttest]
extends               = env:esp32dev
build_flags           = -DBBS_WDT_TEST

; The public release, built by tools/release.py and by the GitHub Action on a
; version tag. BBS_RELEASE makes main.cpp ignore include/secrets.h even when
; the file exists, so a release built on a developer's own machine still
; carries nobody's Wi-Fi. The board gets its network from Improv instead.
;   python3 tools/release.py
[env:esp32dev_release]
extends               = env:esp32dev
build_flags           = -DBBS_RELEASE

; ---------------------------------------------------------------------------
; Waveshare ESP32-S3-LCD-1.47 (SKU 28317, the USB-A stick): ESP32-S3R8,
; 16 MB quad flash, 8 MB octal PSRAM, a TF slot, one WS2812B and a 1.47"
; ST7789 panel. A board profile, never a fork: BBS_BOARD_WS_S3LCD147 picks
; its defaults in src/board.h and compiles in what only it has (the panel
; plugin). Its sdkconfig layer is sdkconfig.defaults.esp32s3, which ESP-IDF
; reads after sdkconfig.defaults for every esp32s3 build without being told.
;
; It has no USB-serial bridge: the USB-A plug is the S3's own USB, which is
; the console, the flashing port and Improv's port all at once.
;   pio run -e ws_s3_lcd147 -t upload --upload-port COMn
;   pio run -e ws_s3_lcd147 -t uploadfs --upload-port COMn    (the screens)
;
; The 4 MB partition layout for now, so nothing else moves: the other 12 MB
; is unused until a measured step says what it is for. Flash mode DIO, as
; Waveshare's own demo runs it; QIO is untried on this part.
; See ESP32_BOARD_CHOICE.md and internal/board-waveshare-s3-lcd147-2026-09-24.md.
[env:ws_s3_lcd147]
platform              = espressif32@6.9.0
board                 = esp32-s3-devkitc-1
framework             = espidf
board_build.flash_mode  = dio
board_upload.flash_size = 16MB
board_build.partitions  = partitions.csv
board_build.filesystem  = littlefs
upload_speed          = 921600
monitor_speed         = 115200
monitor_filters       = esp32_exception_decoder
extra_scripts         = tools/pio_flashall.py
build_flags           = -DBBS_BOARD_WS_S3LCD147

; Its public release, as esp32dev_release is the WROOM's: secrets.h ignored.
;   python3 tools/release.py
[env:ws_s3_lcd147_release]
extends               = env:ws_s3_lcd147
build_flags           = -DBBS_BOARD_WS_S3LCD147 -DBBS_RELEASE
